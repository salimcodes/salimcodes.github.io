name: Build exports

# Rebuilds exports/*.csv and exports/SUMMARY.md whenever a submission lands.
on:
  push:
    branches: [main]
    paths: ["submissions/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exports
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exports
        run: python scripts/build_exports.py
      - name: Commit if changed
        run: |
          git config user.name  "afritaboo-bot"
          git config user.email "afritaboo-bot@users.noreply.github.com"
          git add exports
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild exports"
          # Submissions may have arrived meanwhile; rebase and retry a few times.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
