name: Build exports

# Rebuilds exports/*.csv and exports/SUMMARY.md whenever a submission lands.
on:
  push:
    branches: [main]
    paths: ["submissions/**", "literature/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exports
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and commit exports
        run: |
          git config user.name  "afritaboo-bot"
          git config user.email "afritaboo-bot@users.noreply.github.com"
          # Always build from the newest main. If a submission lands while we build, the push is
          # rejected; start again from the new main and rebuild, so exports never miss a file.
          # (Rebasing a stale build instead conflicts on exports/ and drops the newest submission.)
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/build_exports.py
            git add exports
            if git diff --cached --quiet; then echo "Exports up to date"; exit 0; fi
            git commit -q -m "Rebuild exports"
            git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
